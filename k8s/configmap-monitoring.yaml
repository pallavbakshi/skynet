apiVersion: v1
kind: ConfigMap
metadata:
  name: agp-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: agp
        static_configs:
          - targets:
              - control-plane:7860
        metrics_path: /observability/metrics
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agp-grafana-datasources
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agp-grafana-dashboard-provider
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: AGP
        type: file
        disableDeletion: true
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agp-grafana-dashboards
data:
  agp.json: |
    {
      "uid": "agp-overview",
      "title": "AGP Overview",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "15s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1, "title": "Jobs by Status", "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [{ "expr": "agp_jobs_total", "legendFormat": "{{status}}", "refId": "A" }]
        },
        {
          "id": 2, "title": "Runtimes by Health", "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [{ "expr": "agp_runtime_health_total", "legendFormat": "{{status}}", "refId": "A" }]
        },
        {
          "id": 3, "title": "Active Alerts", "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 8 },
          "targets": [{ "expr": "sum(agp_observability_active_alerts)", "legendFormat": "alerts", "refId": "A" }],
          "options": { "colorMode": "background", "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "red", "value": 1 }] } }
        },
        {
          "id": 4, "title": "Queue Deliveries", "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 6, "y": 8 },
          "targets": [{ "expr": "agp_queue_deliveries_total", "legendFormat": "{{state}}", "refId": "A" }]
        },
        {
          "id": 5, "title": "Leases by Status", "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 8 },
          "targets": [{ "expr": "agp_leases_total", "legendFormat": "{{status}}", "refId": "A" }]
        },
        {
          "id": 6, "title": "Agents by Status", "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [{ "expr": "agp_agents_total", "legendFormat": "{{status}}", "refId": "A" }]
        },
        {
          "id": 7, "title": "Event Sequence", "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 16 },
          "targets": [{ "expr": "agp_events_latest_seq", "legendFormat": "seq", "refId": "A" }]
        }
      ]
    }
