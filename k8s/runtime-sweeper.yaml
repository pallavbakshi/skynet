apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime-sweeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runtime-sweeper
  template:
    metadata:
      labels:
        app: runtime-sweeper
    spec:
      containers:
        - name: runtime-sweeper
          image: agp:latest
          command:
            - python
            - -m
            - agp
            - sweep-runtimes-loop
            - --interval-seconds
            - "10"
          envFrom:
            - configMapRef:
                name: agp-config
            - secretRef:
                name: agp-secrets
          volumeMounts:
            - name: data
              mountPath: /data
            - name: artifacts
              mountPath: /artifacts
            - name: logs
              mountPath: /logs
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agp-data
        - name: artifacts
          persistentVolumeClaim:
            claimName: agp-artifacts
        - name: logs
          persistentVolumeClaim:
            claimName: agp-logs
