apiVersion: batch/v1
kind: Job
metadata:
  name: agp-bootstrap
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: agp-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: agp:latest
          command:
            - python
            - scripts/bootstrap_local_stack.py
          envFrom:
            - configMapRef:
                name: agp-config
            - secretRef:
                name: agp-secrets
          volumeMounts:
            - name: data
              mountPath: /data
            - name: artifacts
              mountPath: /artifacts
            - name: logs
              mountPath: /logs
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agp-data
        - name: artifacts
          persistentVolumeClaim:
            claimName: agp-artifacts
        - name: logs
          persistentVolumeClaim:
            claimName: agp-logs
