apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime
spec:
  template:
    spec:
      containers:
        - name: runtime
          imagePullPolicy: IfNotPresent
      volumes:
        - $patch: replace
        - name: data
          emptyDir: {}
        - name: artifacts
          emptyDir: {}
        - name: logs
          emptyDir: {}
