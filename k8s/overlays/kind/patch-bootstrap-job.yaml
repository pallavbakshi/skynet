apiVersion: batch/v1
kind: Job
metadata:
  name: agp-bootstrap
spec:
  template:
    spec:
      containers:
        - name: bootstrap
          imagePullPolicy: IfNotPresent
      volumes:
        - $patch: replace
        - name: data
          emptyDir: {}
        - name: artifacts
          emptyDir: {}
        - name: logs
          emptyDir: {}
