apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runtime
  template:
    metadata:
      labels:
        app: runtime
    spec:
      containers:
        - name: runtime
          image: agp-runtime:latest
          command:
            - sh
            - -lc
            - python /app/scripts/wait_for_http.py http://control-plane:7860/health --timeout 180 && exec agp-runtime-entrypoint
          envFrom:
            - configMapRef:
                name: agp-config
            - secretRef:
                name: agp-secrets
          env:
            - name: AGP_RUNTIME_ID
              value: rtm_local
            - name: AGP_RUNTIME_HOSTNAME
              value: runtime-1
            - name: AGP_RUNTIME_AGENT_ID
              value: agt_local
            - name: AGP_RUNTIME_TERMINAL_HOST_KIND
              value: inprocess
            - name: AGP_RUNTIME_AGENT_ADAPTER_KIND
              value: default
            - name: AGP_CODEX_TUI_MODE
              value: "false"
            - name: AGP_RUNTIME_CAPABILITIES
              value: "python"
            - name: AGP_RUNTIME_IDLE_SLEEP_SECONDS
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: artifacts
              mountPath: /artifacts
            - name: logs
              mountPath: /logs
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agp-data
        - name: artifacts
          persistentVolumeClaim:
            claimName: agp-artifacts
        - name: logs
          persistentVolumeClaim:
            claimName: agp-logs
