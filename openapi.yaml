openapi: 3.1.0
info:
  title: AGP Control Plane API
  version: 0.2.0
  description: >
    OpenAPI contract derived from the authoritative AGP control-plane specs.
    This document defines the network contract for orchestration clients and runtimes.
    V1 authentication uses bearer tokens only; /health is intentionally unauthenticated.
servers:
  - url: http://127.0.0.1:7860
tags:
  - name: orchestration
  - name: agents
  - name: capabilities
  - name: runtimes
  - name: runs
  - name: artifacts
  - name: health
security:
  - bearerAuth: []
paths:
  /messages/send:
    post:
      tags: [orchestration]
      summary: Send work to a logical agent or capability target
      operationId: sendMessage
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: Immediate result or accepted async response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/InlineResultEnvelope'
                  - $ref: '#/components/schemas/AcceptedAsyncEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /jobs:
    get:
      tags: [orchestration]
      summary: List jobs
      operationId: listJobs
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/JobStatus'
        - in: query
          name: target_agent_id
          schema:
            type: string
        - in: query
          name: created_after
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Job list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /jobs/{job_id}:
    get:
      tags: [orchestration]
      summary: Get job
      operationId: getJob
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job state and run summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetJobEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /jobs/{job_id}/events:
    get:
      tags: [orchestration]
      summary: Get ordered event history for a job
      operationId: getJobEvents
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Ordered event list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /jobs/{job_id}/interrupt:
    post:
      tags: [orchestration]
      summary: Interrupt job
      operationId: interruptJob
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Interrupt accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterruptEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /jobs/{job_id}/block:
    post:
      tags: [orchestration]
      summary: Move a queued job into blocked state
      operationId: blockJob
      parameters:
        - $ref: '#/components/parameters/JobId'
        - in: query
          name: reason
          schema:
            type: string
      responses:
        '200':
          description: Job blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /jobs/{job_id}/unblock:
    post:
      tags: [orchestration]
      summary: Move a blocked job back to queued state
      operationId: unblockJob
      parameters:
        - $ref: '#/components/parameters/JobId'
        - in: query
          name: reason
          schema:
            type: string
      responses:
        '200':
          description: Job unblocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /jobs/{job_id}/handoff:
    post:
      tags: [orchestration]
      summary: Create follow-on work from an existing result
      operationId: handoffJob
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoffRequest'
      responses:
        '200':
          description: Handoff created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoffEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /agents:
    get:
      tags: [agents]
      summary: List durable agents
      operationId: listAgents
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/AgentStatus'
        - in: query
          name: capability_id
          schema:
            type: string
        - in: query
          name: created_after
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Agent list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /agents/up:
    post:
      tags: [agents]
      summary: Instantiate durable agent from capability blueprint
      operationId: createAgent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentUpRequest'
      responses:
        '200':
          description: Agent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /agents/{agent_id}/down:
    post:
      tags: [agents]
      summary: Destroy durable agent
      operationId: destroyAgent
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDownRequest'
      responses:
        '200':
          description: Agent teardown accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /capabilities:
    get:
      tags: [capabilities]
      summary: List capability blueprints
      operationId: listCapabilities
      parameters:
        - in: query
          name: name
          schema:
            type: string
        - in: query
          name: version
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Capability list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /runtimes/register:
    post:
      tags: [runtimes]
      summary: Register or refresh runtime identity
      operationId: registerRuntime
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRuntimeRequest'
      responses:
        '200':
          description: Runtime registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeEnvelope'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /runtimes:
    get:
      tags: [runtimes]
      summary: List runtimes
      operationId: listRuntimes
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/RuntimeStatus'
        - in: query
          name: health_status
          schema:
            $ref: '#/components/schemas/HealthStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Runtime list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /runs/claim:
    post:
      tags: [runs]
      summary: Claim a job pull-style
      operationId: claimRun
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRunRequest'
      responses:
        '200':
          description: Job claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimRunEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /runs/{run_id}/heartbeat:
    post:
      tags: [runs]
      summary: Renew lease by heartbeat
      operationId: heartbeatRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaseActionRequest'
      responses:
        '200':
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaseEnvelope'
        '409':
          $ref: '#/components/responses/LeaseExpired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /runs/{run_id}/progress:
    post:
      tags: [runs]
      summary: Publish progress
      operationId: progressRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressRequest'
      responses:
        '200':
          description: Progress accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEnvelope'
        '409':
          $ref: '#/components/responses/StaleFencingToken'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /runs/{run_id}/recovering:
    post:
      tags: [runs]
      summary: Enter bounded local recovery
      operationId: recoveringRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryRequest'
      responses:
        '200':
          description: Recovery state accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEnvelope'
        '409':
          $ref: '#/components/responses/StaleFencingToken'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /runs/{run_id}/resumed:
    post:
      tags: [runs]
      summary: Resume a recovering run
      operationId: resumedRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryRequest'
      responses:
        '200':
          description: Run resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEnvelope'
        '409':
          $ref: '#/components/responses/StaleFencingToken'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /runs/{run_id}/cancel:
    post:
      tags: [runs]
      summary: Cancel a running run after interrupt
      operationId: cancelRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRunRequest'
      responses:
        '200':
          description: Run cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEnvelope'
        '409':
          $ref: '#/components/responses/StaleFencingToken'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /runs/{run_id}/complete:
    post:
      tags: [runs]
      summary: Complete run
      operationId: completeRun
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRunRequest'
      responses:
        '200':
          description: Run completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEnvelope'
        '409':
          description: Stale or conflicting terminal report
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /runs/{run_id}/fail:
    post:
      tags: [runs]
      summary: Fail run
      operationId: failRun
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailRunRequest'
      responses:
        '200':
          description: Run failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEnvelope'
        '409':
          description: Stale or conflicting terminal report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /artifacts/{artifact_id}:
    get:
      tags: [artifacts]
      summary: Get artifact metadata
      operationId: getArtifact
      parameters:
        - $ref: '#/components/parameters/ArtifactId'
      responses:
        '200':
          description: Artifact metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /artifacts/{artifact_id}/content:
    get:
      tags: [artifacts]
      summary: Get artifact content or retrieval location
      operationId: getArtifactContent
      parameters:
        - $ref: '#/components/parameters/ArtifactId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Artifact content or retrieval location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactContentEnvelope'
  /health:
    get:
      tags: [health]
      summary: Get platform health
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Platform health summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
  /system/upgrade-status:
    get:
      tags: [health]
      summary: Get persisted release and schema version state
      operationId: getUpgradeStatus
      responses:
        '200':
          description: Upgrade status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeStatusEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
components:
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    JobId:
      in: path
      name: job_id
      required: true
      schema:
        type: string
    RunId:
      in: path
      name: run_id
      required: true
      schema:
        type: string
    AgentId:
      in: path
      name: agent_id
      required: true
      schema:
        type: string
    ArtifactId:
      in: path
      name: artifact_id
      required: true
      schema:
        type: string
  responses:
    InvalidRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthenticated:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    LeaseExpired:
      description: Lease expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    StaleFencingToken:
      description: Stale fencing token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - not_found
        - conflict
        - stale_fencing_token
        - lease_expired
        - already_terminal
        - not_eligible
        - unauthenticated
        - forbidden
        - rate_limited
        - internal_error
    JobStatus:
      type: string
      enum: [accepted, queued, running, interrupt_requested, completed, failed, cancelled, blocked]
    RunStatus:
      type: string
      enum: [created, leased, running, recovering, completed, failed, abandoned, cancelled]
    AgentStatus:
      type: string
      enum: [provisioning, idle, busy, degraded, draining, terminated]
    RuntimeStatus:
      type: string
      enum: [registering, idle, busy, degraded, offline, draining]
    HealthStatus:
      type: string
      enum: [healthy, degraded, unreachable, draining]
    ArtifactKind:
      type: string
      enum: [prompt, transcript_log, exec_log, result, failure_evidence]
    ErrorEnvelope:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            retryable:
              type: boolean
    PageInfo:
      type: object
      required: [has_more]
      properties:
        next_cursor:
          type: string
        has_more:
          type: boolean
    TargetRef:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [agent, capability]
        id:
          type: string
    MessagePayload:
      type: object
      required: [text]
      properties:
        text:
          type: string
        metadata:
          type: object
          additionalProperties: true
    SendMessageRequest:
      type: object
      required: [target, message]
      properties:
        target:
          $ref: '#/components/schemas/TargetRef'
        message:
          $ref: '#/components/schemas/MessagePayload'
        detach_policy:
          type: object
          additionalProperties: true
    JobSummary:
      type: object
      required: [job_id, message_id, target_queue, status, retry_count, max_retries]
      properties:
        job_id:
          type: string
        message_id:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        target_agent_id:
          type: string
        target_queue:
          type: string
          description: Canonical queue key such as `agent:agt_123` or `capability:cap_python:v1`.
        latest_run_id:
          type: string
        retry_count:
          type: integer
        max_retries:
          type: integer
        result_artifact_id:
          type: string
    RunSummary:
      type: object
      required: [run_id, job_id, agent_id, runtime_id, attempt, status]
      properties:
        run_id:
          type: string
        job_id:
          type: string
        status:
          $ref: '#/components/schemas/RunStatus'
        attempt:
          type: integer
        agent_id:
          type: string
        runtime_id:
          type: string
    ArtifactSummary:
      type: object
      required: [artifact_id, kind, content_type, storage_ref, checksum, size_bytes, created_at]
      properties:
        artifact_id:
          type: string
        kind:
          $ref: '#/components/schemas/ArtifactKind'
        content_type:
          type: string
        storage_ref:
          type: string
        checksum:
          type: string
        size_bytes:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    EventRecord:
      type: object
      required: [event_id, event_seq, event_type, created_at]
      properties:
        event_id:
          type: string
        event_seq:
          type: integer
          format: int64
        event_type:
          type: string
        job_id:
          type: string
        run_id:
          type: string
        agent_id:
          type: string
        runtime_id:
          type: string
        body:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    AgentSummary:
      type: object
      required: [agent_id, capability_id, status, queue_id]
      properties:
        agent_id:
          type: string
        capability_id:
          type: string
        assigned_runtime_id:
          type: string
        queue_id:
          type: string
        status:
          $ref: '#/components/schemas/AgentStatus'
        workspace_ref:
          type: string
    RuntimeSummary:
      type: object
      required: [runtime_id, hostname, release_version, status, health_status, last_heartbeat_at]
      properties:
        runtime_id:
          type: string
        hostname:
          type: string
        release_version:
          type: string
        status:
          $ref: '#/components/schemas/RuntimeStatus'
        health_status:
          $ref: '#/components/schemas/HealthStatus'
        last_heartbeat_at:
          type: string
          format: date-time
        metadata_json:
          type: object
          additionalProperties: true
    CapabilitySummary:
      type: object
      required: [capability_id, name, version, image_ref, model_ref, resource_tier, permission_profile, queue_mode]
      properties:
        capability_id:
          type: string
        name:
          type: string
        version:
          type: string
        image_ref:
          type: string
        model_ref:
          type: string
        resource_tier:
          type: string
        permission_profile:
          type: string
        queue_mode:
          type: string
        runtime_requirements_json:
          type: object
          additionalProperties: true
    LeaseSummary:
      type: object
      required: [lease_id, run_id, agent_id, runtime_id, fencing_token, status, expires_at, created_at]
      properties:
        lease_id:
          type: string
        run_id:
          type: string
        agent_id:
          type: string
        runtime_id:
          type: string
        fencing_token:
          type: integer
          format: int64
        status:
          type: string
          enum: [active, expired, released]
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        released_at:
          type: string
          format: date-time
    InlineResultEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data:
          type: object
