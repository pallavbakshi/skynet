services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agp
      POSTGRES_USER: agp
      POSTGRES_PASSWORD: agp
    volumes:
      - agp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agp -d agp"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # Queue transport is intentionally volatile in this local/dev stack.
    # AGP reconstructs queue state from the authoritative database on recovery.
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - agp_minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  control-plane:
    build:
      context: .
      target: agp-control-plane
    command:
      - sh
      - -lc
      - python -m agp initdb && python -m agp serve --host 0.0.0.0 --port 7860
    environment:
      AGP_HOST: 0.0.0.0
      AGP_PORT: "7860"
      AGP_DATABASE_URL: postgresql+psycopg://agp:agp@postgres:5432/agp
      AGP_QUEUE_BACKEND: redis
      AGP_REDIS_URL: redis://redis:6379/0
      AGP_REDIS_QUEUE_KEY_PREFIX: agp-phase3
      AGP_ARTIFACT_BACKEND: s3
      AGP_ARTIFACT_ROOT: /artifacts
      AGP_LOG_ROOT: /logs
      AGP_S3_ENDPOINT_URL: http://minio:9000
      AGP_S3_ACCESS_KEY_ID: minioadmin
      AGP_S3_SECRET_ACCESS_KEY: minioadmin
      AGP_S3_BUCKET: agp-artifacts
      AGP_S3_REGION: us-east-1
      AGP_S3_FORCE_PATH_STYLE: "true"
    volumes:
      - agp_logs:/logs
    ports:
      - "7860:7860"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20

  bootstrap:
    build:
      context: .
      target: agp-control-plane
    command: ["python", "scripts/bootstrap_local_stack.py"]
    environment:
      AGP_DATABASE_URL: postgresql+psycopg://agp:agp@postgres:5432/agp
      AGP_QUEUE_BACKEND: redis
      AGP_REDIS_URL: redis://redis:6379/0
      AGP_REDIS_QUEUE_KEY_PREFIX: agp-phase3
      AGP_ARTIFACT_BACKEND: s3
      AGP_ARTIFACT_ROOT: /artifacts
      AGP_LOG_ROOT: /logs
      AGP_SERVER_URL: http://control-plane:7860
      AGP_BOOTSTRAP_CAPABILITY_ID: cap_python
      AGP_BOOTSTRAP_AGENT_ID: agt_local
      AGP_BOOTSTRAP_RUNTIME_ID: rtm_local
      AGP_S3_ENDPOINT_URL: http://minio:9000
      AGP_S3_ACCESS_KEY_ID: minioadmin
      AGP_S3_SECRET_ACCESS_KEY: minioadmin
      AGP_S3_BUCKET: agp-artifacts
      AGP_S3_REGION: us-east-1
      AGP_S3_FORCE_PATH_STYLE: "true"
    volumes:
      - agp_logs:/logs
    depends_on:
      control-plane:
        condition: service_healthy
    restart: "no"

  runtime:
    build:
      context: .
      target: agp-runtime
    hostname: agp-runtime
    mac_address: "02:42:37:fc:f5:93"
    environment:
      AGP_DATABASE_URL: postgresql+psycopg://agp:agp@postgres:5432/agp
      AGP_QUEUE_BACKEND: redis
      AGP_REDIS_URL: redis://redis:6379/0
      AGP_REDIS_QUEUE_KEY_PREFIX: agp-phase3
      AGP_ARTIFACT_BACKEND: s3
      AGP_ARTIFACT_ROOT: /artifacts
      AGP_LOG_ROOT: /logs
      AGP_S3_ENDPOINT_URL: http://minio:9000
      AGP_S3_ACCESS_KEY_ID: minioadmin
      AGP_S3_SECRET_ACCESS_KEY: minioadmin
      AGP_S3_BUCKET: agp-artifacts
      AGP_S3_REGION: us-east-1
      AGP_S3_FORCE_PATH_STYLE: "true"
      AGP_SERVER_URL: http://control-plane:7860
      AGP_RUNTIME_ID: rtm_local
      AGP_RUNTIME_HOSTNAME: runtime-1
      AGP_RUNTIME_AGENT_ID: agt_local
      AGP_RUNTIME_TERMINAL_HOST_KIND: tmux
      AGP_RUNTIME_AGENT_ADAPTER_KIND: codex
      AGP_CODEX_TUI_MODE: "true"
      AGP_RUNTIME_IDLE_SLEEP_SECONDS: "1"
    volumes:
      - agp_credentials:/credentials
      - agp_logs:/logs
    depends_on:
      control-plane:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully

  lease-sweeper:
    build:
      context: .
      target: agp-control-plane
    command: ["python", "-m", "agp", "sweep-loop", "--interval-seconds", "5"]
    environment:
      AGP_DATABASE_URL: postgresql+psycopg://agp:agp@postgres:5432/agp
      AGP_QUEUE_BACKEND: redis
      AGP_REDIS_URL: redis://redis:6379/0
      AGP_REDIS_QUEUE_KEY_PREFIX: agp-phase3
      AGP_ARTIFACT_BACKEND: s3
      AGP_ARTIFACT_ROOT: /artifacts
      AGP_LOG_ROOT: /logs
      AGP_S3_ENDPOINT_URL: http://minio:9000
      AGP_S3_ACCESS_KEY_ID: minioadmin
      AGP_S3_SECRET_ACCESS_KEY: minioadmin
      AGP_S3_BUCKET: agp-artifacts
      AGP_S3_REGION: us-east-1
      AGP_S3_FORCE_PATH_STYLE: "true"
    volumes:
      - agp_logs:/logs
    depends_on:
      control-plane:
        condition: service_healthy

  runtime-sweeper:
    build:
      context: .
      target: agp-control-plane
    command: ["python", "-m", "agp", "sweep-runtimes-loop", "--interval-seconds", "10"]
    environment:
      AGP_DATABASE_URL: postgresql+psycopg://agp:agp@postgres:5432/agp
      AGP_QUEUE_BACKEND: redis
      AGP_REDIS_URL: redis://redis:6379/0
      AGP_REDIS_QUEUE_KEY_PREFIX: agp-phase3
      AGP_ARTIFACT_BACKEND: s3
      AGP_ARTIFACT_ROOT: /artifacts
      AGP_LOG_ROOT: /logs
      AGP_S3_ENDPOINT_URL: http://minio:9000
      AGP_S3_ACCESS_KEY_ID: minioadmin
      AGP_S3_SECRET_ACCESS_KEY: minioadmin
      AGP_S3_BUCKET: agp-artifacts
      AGP_S3_REGION: us-east-1
      AGP_S3_FORCE_PATH_STYLE: "true"
    volumes:
      - agp_logs:/logs
    depends_on:
      control-plane:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - agp_prometheus:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      control-plane:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - agp_grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  agp_pgdata:
  agp_minio:
  agp_logs:
  agp_credentials:
    # Shared credentials volume — initialized by `skyops runtime auth`.
    # Pre-populated with OAuth tokens, API keys, and .env config.
    # Mount name uses compose project prefix: agp_agp_credentials
    # To use the standalone volume instead: external: true, name: agp-credentials
    external: true
    name: agp-credentials
  agp_prometheus:
  agp_grafana:
