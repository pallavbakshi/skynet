services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  control-plane:
    build:
      context: .
      target: agp-control-plane
    command:
      - sh
      - -lc
      - python -m agp initdb && python -m agp serve --host 0.0.0.0 --port 7860
    environment:
      AGP_HOST: 0.0.0.0
      AGP_PORT: "7860"
      AGP_DATABASE_URL: sqlite+pysqlite:////data/agp.db
      AGP_QUEUE_BACKEND: redis
      AGP_REDIS_URL: redis://redis:6379/0
      AGP_REDIS_QUEUE_KEY_PREFIX: agp-local
      AGP_ARTIFACT_BACKEND: registryfs
      AGP_ARTIFACT_ROOT: /artifacts
      AGP_LOG_ROOT: /logs
    volumes:
      - agp_data:/data
      - agp_artifacts:/artifacts
      - agp_logs:/logs
    ports:
      - "7860:7860"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20

  bootstrap:
    build:
      context: .
      target: agp-control-plane
    command: ["python", "scripts/bootstrap_local_stack.py"]
    environment:
      AGP_DATABASE_URL: sqlite+pysqlite:////data/agp.db
      AGP_QUEUE_BACKEND: redis
      AGP_REDIS_URL: redis://redis:6379/0
      AGP_REDIS_QUEUE_KEY_PREFIX: agp-local
      AGP_ARTIFACT_BACKEND: registryfs
      AGP_ARTIFACT_ROOT: /artifacts
      AGP_LOG_ROOT: /logs
      AGP_SERVER_URL: http://control-plane:7860
      AGP_BOOTSTRAP_CAPABILITY_ID: cap_python
      AGP_BOOTSTRAP_AGENT_ID: agt_local
      AGP_BOOTSTRAP_RUNTIME_ID: rtm_local
    volumes:
      - agp_data:/data
      - agp_artifacts:/artifacts
      - agp_logs:/logs
    depends_on:
      control-plane:
        condition: service_healthy
    restart: "no"

  runtime:
    build:
      context: .
      target: agp-runtime
    environment:
      AGP_DATABASE_URL: sqlite+pysqlite:////data/agp.db
      AGP_QUEUE_BACKEND: redis
      AGP_REDIS_URL: redis://redis:6379/0
      AGP_REDIS_QUEUE_KEY_PREFIX: agp-local
      AGP_ARTIFACT_BACKEND: registryfs
      AGP_ARTIFACT_ROOT: /artifacts
      AGP_LOG_ROOT: /logs
      AGP_SERVER_URL: http://control-plane:7860
      AGP_RUNTIME_ID: rtm_local
      AGP_RUNTIME_HOSTNAME: runtime-1
      AGP_RUNTIME_AGENT_ID: agt_local
      AGP_RUNTIME_TERMINAL_HOST_KIND: inprocess
      AGP_RUNTIME_AGENT_ADAPTER_KIND: default
      AGP_CODEX_TUI_MODE: "false"
      AGP_RUNTIME_IDLE_SLEEP_SECONDS: "1"
    volumes:
      - agp_data:/data
      - agp_artifacts:/artifacts
      - agp_logs:/logs
    depends_on:
      control-plane:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully

  lease-sweeper:
    build:
      context: .
      target: agp-control-plane
    command: ["python", "-m", "agp", "sweep-loop", "--interval-seconds", "5"]
    environment:
      AGP_DATABASE_URL: sqlite+pysqlite:////data/agp.db
      AGP_QUEUE_BACKEND: redis
      AGP_REDIS_URL: redis://redis:6379/0
      AGP_REDIS_QUEUE_KEY_PREFIX: agp-local
      AGP_ARTIFACT_BACKEND: registryfs
      AGP_ARTIFACT_ROOT: /artifacts
      AGP_LOG_ROOT: /logs
    volumes:
      - agp_data:/data
      - agp_artifacts:/artifacts
      - agp_logs:/logs
    depends_on:
      control-plane:
        condition: service_healthy

  runtime-sweeper:
    build:
      context: .
      target: agp-control-plane
    command: ["python", "-m", "agp", "sweep-runtimes-loop", "--interval-seconds", "10"]
    environment:
      AGP_DATABASE_URL: sqlite+pysqlite:////data/agp.db
      AGP_QUEUE_BACKEND: redis
      AGP_REDIS_URL: redis://redis:6379/0
      AGP_REDIS_QUEUE_KEY_PREFIX: agp-local
      AGP_ARTIFACT_BACKEND: registryfs
      AGP_ARTIFACT_ROOT: /artifacts
      AGP_LOG_ROOT: /logs
    volumes:
      - agp_data:/data
      - agp_artifacts:/artifacts
      - agp_logs:/logs
    depends_on:
      control-plane:
        condition: service_healthy

volumes:
  agp_data:
  agp_artifacts:
  agp_logs:
