[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agp"
version = "0.1.0"
description = "Agentic Plane control plane scaffold"
readme = "research/master-prd.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5,<6",
  "uvicorn>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "typer>=0.12,<1.0",
]

[project.scripts]
agp = "agp.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agp"]
